name: iac-apply

# Chained: runs when iac-plan completes successfully on main.
# Promotion: apply-dev first, then apply-prod (gated by the "prod" environment
# = required reviewers => manual approval). Only affected cloud/stage combos run.
on:
  workflow_run:
    workflows: ["iac-plan"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  TOFU_VERSION: 1.10.1
  TG_VERSION: 0.82.3
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  load:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      dev: ${{ steps.l.outputs.dev }}
      prod: ${{ steps.l.outputs.prod }}
      has_dev: ${{ steps.l.outputs.has_dev }}
      has_prod: ${{ steps.l.outputs.has_prod }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
      - name: Download affected matrix (from iac-plan run)
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: affected
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: l
        run: |
          if [ ! -f affected.json ]; then
            bash .github/scripts/affected.sh "" "" > affected.json
          fi
          DEV="$(jq -c '{include: [.include[] | select(.stage=="dev")]}' affected.json)"
          PROD="$(jq -c '{include: [.include[] | select(.stage=="prod")]}' affected.json)"
          echo "dev=$DEV" >> "$GITHUB_OUTPUT"
          echo "prod=$PROD" >> "$GITHUB_OUTPUT"
          { [ "$(printf '%s' "$DEV" | jq '.include | length')" -gt 0 ] && echo "has_dev=true" || echo "has_dev=false"; } >> "$GITHUB_OUTPUT"
          { [ "$(printf '%s' "$PROD" | jq '.include | length')" -gt 0 ] && echo "has_prod=true" || echo "has_prod=false"; } >> "$GITHUB_OUTPUT"

  apply-dev:
    needs: load
    if: needs.load.outputs.has_dev == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load.outputs.dev) }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUD: ${{ matrix.cloud }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Apply dev (all stacks)
        run: make apply-all

  apply-prod:
    needs: [load, apply-dev]
    if: >
      always() &&
      needs.load.outputs.has_prod == 'true' &&
      (needs.apply-dev.result == 'success' || needs.apply-dev.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.load.outputs.prod) }}
    runs-on: ubuntu-latest
    environment: prod
    env:
      CLOUD: ${{ matrix.cloud }}
      STAGE: ${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Apply prod (all stacks)
        run: make apply-all
