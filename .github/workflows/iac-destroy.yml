name: iac-destroy

# Manual only. Destroys ALL stacks (app stacks under live/) for the selected
# cloud/stage. Gated by the same GitHub Environments used for apply
# (environment: dev/test/prod => required reviewers = manual approval).
# NOTE: for dev to also require approval, add required reviewers to the
# "dev" environment in Settings -> Environments (apply-dev runs without
# approval on purpose, but destroy is irreversible for all stages).
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider
        type: choice
        options: [azure]
        default: azure
      stage:
        description: Stage to destroy COMPLETELY (all stacks)
        type: choice
        options: [dev,test]

permissions:
  contents: read

env:
  TOFU_VERSION: 1.10.1
  TG_VERSION: 0.82.3
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    env:
      CLOUD: ${{ inputs.cloud }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_version: ${{ env.TG_VERSION }}
          tofu_version: ${{ env.TOFU_VERSION }}
          tg_command: --version
      - name: Destroy ${{ inputs.cloud }}/${{ inputs.stage }} (all stacks)
        run: make destroy-all
